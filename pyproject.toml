[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-observer"
version = "0.1.0"
description = "Point-in-time Base pool observation and research infrastructure"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crypto-observer = "crypto_observer.cli:main"

[tool.setuptools.packages.find]
include = ["crypto_observer*"]
